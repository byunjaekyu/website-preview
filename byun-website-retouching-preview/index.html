<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BYUN JAEKYU — Works</title><style>
*{box-sizing:border-box}body{margin:0;font:14px/1.8 Arial,'Malgun Gothic',sans-serif;color:#222}a{color:inherit}header{padding:30px 4%;display:flex;justify-content:space-between;align-items:center;gap:20px;border-bottom:1px solid #ddd}header strong{font-size:21px;font-weight:500}nav{display:flex;flex-wrap:wrap;gap:18px}nav a{text-decoration:none;font-size:12px}.layout{display:grid;grid-template-columns:25% minmax(0,1fr);gap:6%;padding:35px 4%}aside{position:sticky;top:20px;align-self:start;max-height:95vh;overflow:auto}aside button{display:block;background:none;border:0;text-align:left;padding:6px 0;cursor:pointer;font:13px/1.6 inherit;color:#666}aside button.active{font-weight:bold;color:#111}aside .year{display:block;margin-top:15px;color:#999;font-size:11px}main{max-width:900px}h1{font-size:28px;line-height:1.4;font-weight:500;margin:0}small{color:#777}.hero{margin-top:25px}img{width:100%;height:auto;display:block}figure{margin:28px 0}figcaption{font-size:11px;color:#777;margin-top:6px}p{line-height:1.95;white-space:pre-line}.video{aspect-ratio:16/9;width:100%;border:0}.section{display:none}.section.active{display:block}#work-content{display:block}#work-content.hidden{display:none}@media(max-width:720px){header{display:block;padding:20px}nav{margin-top:15px;gap:10px 16px}.layout{display:block;padding:20px}aside{position:static;max-height:220px;overflow:auto;border-bottom:1px solid #eee;margin-bottom:28px}h1{font-size:24px}}
</style></head><body><header><strong>BYUN JAEKYU</strong><nav><a href="#works">Works</a><a href="#research">Research</a><a href="#about">About</a><a href="#cv">CV</a><a href="#contact">Contact</a></nav></header><div class="layout"><aside id="work-list" aria-label="Works"></aside><main><div id="work-content"></div><section class="section" id="research"><h1>Research</h1><p>연구 자료를 추가할 예정입니다.</p></section><section class="section" id="about"><h1>About</h1><p>작가 소개를 추가할 예정입니다.</p></section><section class="section" id="cv"><h1>CV</h1><p>기존 홈페이지의 CV를 이곳에 이전할 예정입니다.</p></section><section class="section" id="contact"><h1>Contact</h1><p><a href="https://vimeo.com/byunjaekyu">Vimeo ↗</a></p></section></main></div><script>
let works=[];const list=document.getElementById('work-list'),content=document.getElementById('work-content');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function videoId(url){let m=String(url||'').match(/vimeo\.com\/(?:video\/)?(\d+)/);return m?m[1]:null}function render(){let id=decodeURIComponent(location.hash.slice(1));let section=['research','about','cv','contact'].includes(id)?id:null;document.querySelectorAll('.section').forEach(e=>e.classList.toggle('active',e.id===section));content.classList.toggle('hidden',!!section);if(section)return;let work=works.find(w=>w.slug===id)||works[0];if(!work)return;list.querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.slug===work.slug));let vid=videoId(work.video);let hero=work.cover?`<img class="hero" src="${esc(work.cover)}" alt="${esc(work.title)}">`:'';let images=(work.images||[]).filter(im=>im.file&&im.file!==work.cover).map(im=>`<figure><img loading="lazy" src="${esc(im.file)}" alt="${esc(im.caption||work.title)}"><figcaption>${esc(im.caption||'')}</figcaption></figure>`).join('');content.innerHTML=`<h1>${esc(work.title)}</h1><small>${esc(work.medium||'')} · ${esc(work.year)}</small>${hero}${vid?`<figure><iframe class="video" src="https://player.vimeo.com/video/${vid}" title="${esc(work.title)}" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen loading="lazy"></iframe></figure>`:''}<p>${esc(work.description||'')}</p>${images}${(work.links||[]).filter(x=>/^https?:\/\//.test(x.url||'')).map(x=>`<p><a href="${esc(x.url)}" target="_blank" rel="noopener noreferrer">${esc(x.label||x.url)} ↗</a></p>`).join('')}`}
fetch('works.json').then(r=>{if(!r.ok)throw Error('works.json not found');return r.json()}).then(data=>{works=data;let prev='';list.innerHTML=works.map(w=>{let year=String(w.year);let marker=year!==prev?`<span class="year">${esc(year)}</span>`:'';prev=year;return `${marker}<button data-slug="${esc(w.slug)}">${esc(w.title)}</button>`}).join('');list.querySelectorAll('button').forEach(b=>b.onclick=()=>location.hash=b.dataset.slug);render()}).catch(e=>content.textContent=e.message);window.addEventListener('hashchange',()=>{render();scrollTo(0,0)});
</script></body></html>
